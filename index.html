<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radio Me • Head Unit Edition</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d1424">
    <!-- HLS.js versi legacy-compatible untuk Chrome Android lawas -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b1220;
            color: #f1f5f9;
        }
        body.theme-twilight {
            background-color: #162238;
        }
        body.theme-twilight .panel,
        body.theme-twilight .topbar {
            background-color: #1c2a45;
        }

        /* Layout Utama */
        .app-wrap {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* Header / Topbar */
        .topbar {
            height: 52px;
            background-color: #0f172a;
            border-bottom: 1px solid #202d48;
            padding: 0 14px;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
        }
        .brand {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
        }
        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: #0284c7;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            margin-right: 10px;
        }
        .brand-title {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #ffffff;
        }
        .brand-badge {
            margin-left: 8px;
            padding: 2px 7px;
            border-radius: 5px;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: #38bdf8;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .clock-box {
            padding: 5px 14px;
            border-radius: 10px;
            background: #0b1220;
            border: 1px solid #202d48;
            font-family: "Courier New", Courier, monospace;
            font-size: 17px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 2px;
        }
        .top-actions {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
        }
        .btn-top {
            background: #0b1220;
            border: 1px solid #202d48;
            color: #e2e8f0;
            border-radius: 9px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-left: 6px;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
        }
        .btn-top:active {
            background: #1e293b;
        }

        /* Main Split Screen */
        .main-area {
            -webkit-flex: 1;
            flex: 1;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: row;
            flex-direction: row;
            overflow: hidden;
            padding: 10px;
        }
        .panel {
            background-color: #121a2d;
            border: 1px solid #202d48;
            border-radius: 16px;
            padding: 12px;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            overflow: hidden;
        }

        /* Panel Kiri: Player */
        .left-panel {
            width: 37%;
            margin-right: 10px;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            overflow-y: auto;
        }
        .player-head {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            border-bottom: 1px solid #202d48;
            padding-bottom: 10px;
        }
        .player-head-info {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            overflow: hidden;
            -webkit-flex: 1;
            flex: 1;
        }
        .avatar-small {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #162238;
            border: 1px solid #223252;
            overflow: hidden;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            margin-right: 10px;
        }
        .avatar-small img, .art-large img, .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .text-cut {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            margin-bottom: 3px;
        }
        .status-live { background: rgba(16,185,129,0.2); color: #6ee7b7; border-color: #10b981; }
        .status-buff { background: rgba(56,189,248,0.2); color: #7dd3fc; border-color: #38bdf8; }
        .status-pause { background: rgba(245,158,11,0.2); color: #fcd34d; border-color: #f59e0b; }
        .status-err { background: rgba(244,63,94,0.2); color: #fda4af; border-color: #f43f5e; }

        .station-title {
            font-size: 17px;
            font-weight: 900;
            color: #ffffff;
        }
        .station-sub {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Visualizer & Cover */
        .art-box {
            margin: 8px 0;
            padding: 12px 10px;
            border-radius: 14px;
            background: #0b1220;
            border: 1px solid #1e2a44;
            text-align: center;
        }
        .art-large {
            width: 86px;
            height: 86px;
            border-radius: 14px;
            margin: 0 auto 8px auto;
            overflow: hidden;
            border: 2px solid #334155;
            background: #162238;
        }
        .url-text {
            font-family: "Courier New", Courier, monospace;
            font-size: 11px;
            color: #94a3b8;
            background: #121a2d;
            border: 1px solid #202d48;
            border-radius: 8px;
            padding: 4px 8px;
        }
        .btn-fix {
            margin-top: 8px;
            padding: 6px 12px;
            border-radius: 9px;
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #f59e0b;
            color: #fcd34d;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        /* Kontrol Besar Head Unit */
        .controls-row {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            margin: 6px 0;
        }
        .btn-ctrl {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: #162238;
            border: 1px solid #253659;
            color: #e2e8f0;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
        }
        .btn-ctrl:active { background: #1e2f4d; }
        .btn-play {
            width: 74px;
            height: 74px;
            border-radius: 22px;
            background: #0284c7;
            border: 2px solid #38bdf8;
            color: #ffffff;
            margin: 0 14px;
            cursor: pointer;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
        }
        .btn-play:active { background: #0369a1; }

        .fav-row {
            text-align: center;
            margin: 4px 0;
        }
        .btn-fav-main {
            background: #162238;
            border: 1px solid #253659;
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Volume Bar */
        .vol-box {
            background: #0b1220;
            border: 1px solid #202d48;
            border-radius: 12px;
            padding: 6px 8px;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
        }
        .btn-vol {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: #162238;
            border: 1px solid #253659;
            color: #ffffff;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
        }
        .vol-slider {
            -webkit-flex: 1;
            flex: 1;
            margin: 0 8px;
            height: 8px;
        }
        .vol-pct {
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            font-weight: 700;
            width: 36px;
            text-align: right;
            margin-left: 6px;
        }

        /* Panel Kanan: Daftar Radio */
        .right-panel {
            -webkit-flex: 1;
            flex: 1;
        }
        .tabs-row {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            border-bottom: 1px solid #202d48;
            padding-bottom: 10px;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
        }
        .tabs-btns {
            display: -webkit-flex;
            display: flex;
        }
        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            margin-right: 6px;
        }
        .tab-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
        }
        .count-badge {
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
            background: #0b1220;
            border: 1px solid #202d48;
            padding: 5px 10px;
            border-radius: 9px;
        }

        /* Search & Filter */
        .toolbar {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            margin: 10px 0;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
        }
        .search-input {
            -webkit-flex: 1;
            flex: 1;
            background: #0b1220;
            border: 1px solid #202d48;
            border-radius: 10px;
            padding: 8px 12px;
            color: #ffffff;
            font-size: 13px;
            margin-right: 8px;
        }
        .https-label {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            background: #0b1220;
            border: 1px solid #202d48;
            border-radius: 10px;
            padding: 7px 10px;
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
            margin-right: 8px;
            cursor: pointer;
        }
        .https-label input {
            margin-left: 6px;
            width: 15px;
            height: 15px;
        }
        .btn-add {
            background: #0284c7;
            border: none;
            color: #ffffff;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        /* Back Province Bar */
        .prov-back {
            display: none;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            background: #0b1220;
            border: 1px solid #202d48;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 8px;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
        }
        .prov-back button {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        /* Grid Daftar Stasiun (2 Kolom Landscape pakai Flexbox wrap agar kompatibel Chrome lawas) */
        .list-scroll {
            -webkit-flex: 1;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        .cards-grid {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-wrap: wrap;
            flex-wrap: wrap;
            margin: -4px;
        }
        .card-item {
            width: 48.5%;
            margin: 4px;
            background: #162238;
            border: 1px solid #202d48;
            border-radius: 12px;
            padding: 9px;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            cursor: pointer;
        }
        .card-item.active-card {
            background: #0c2847;
            border-color: #38bdf8;
        }
        .card-left {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            overflow: hidden;
            -webkit-flex: 1;
            flex: 1;
        }
        .card-thumb {
            width: 42px;
            height: 42px;
            border-radius: 9px;
            background: #0b1220;
            border: 1px solid #253554;
            overflow: hidden;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            margin-right: 10px;
        }
        .card-name {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
        }
        .card-item.active-card .card-name {
            color: #38bdf8;
        }
        .card-meta {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .tag-https {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            padding: 1px 4px;
            border-radius: 4px;
            background: rgba(16,185,129,0.2);
            color: #6ee7b7;
            margin-left: 4px;
        }
        .card-actions {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
        }
        .btn-mini {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            padding: 5px 6px;
            cursor: pointer;
        }
        .btn-mini.starred {
            color: #f59e0b;
        }

        /* Modal */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.78);
            z-index: 100;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-bg.open {
            display: -webkit-flex;
            display: flex;
        }
        .modal-box {
            background: #121a2d;
            border: 1px solid #253659;
            border-radius: 18px;
            width: 100%;
            max-width: 460px;
            max-height: 90%;
            overflow-y: auto;
            padding: 18px;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 4px;
        }
        .form-input {
            width: 100%;
            background: #0b1220;
            border: 1px solid #202d48;
            border-radius: 9px;
            padding: 8px 10px;
            color: #ffffff;
            font-size: 13px;
        }
        .modal-footer {
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: flex-end;
            justify-content: flex-end;
            margin-top: 14px;
        }
        .btn-modal {
            padding: 8px 14px;
            border-radius: 9px;
            border: none;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            margin-left: 8px;
        }
        .btn-cancel { background: #1e293b; color: #cbd5e1; }
        .btn-save { background: #0284c7; color: #ffffff; }
        .btn-del { background: #9f1239; color: #fecdd3; margin-right: auto; margin-left: 0; }
        .timer-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: #0b1220;
            border: 1px solid #202d48;
            color: #38bdf8;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Toast */
        #toast-box {
            position: fixed;
            top: 60px;
            right: 16px;
            z-index: 200;
        }
        .toast-item {
            background: #0f172a;
            border: 1px solid #38bdf8;
            color: #e0f2fe;
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .loading-box {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
            font-size: 13px;
            display: none;
        }

        /* Responsif HP Portrait */
        @media (max-width: 720px) {
            .main-area {
                -webkit-flex-direction: column;
                flex-direction: column;
            }
            .left-panel {
                width: 100%;
                margin-right: 0;
                margin-bottom: 10px;
                max-height: 46%;
            }
            .card-item {
                width: 100%;
            }
            .clock-box {
                display: none;
            }
        }
    </style>
</head>
<body>
<div class="app-wrap">
    <div id="toast-box"></div>

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="brand">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5">
                    <circle cx="12" cy="12" r="2"></circle>
                    <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48 0a6 6 0 0 1 0-8.49m11.31-2.83a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path>
                </svg>
            </div>
            <span class="brand-title">Radio Me</span>
            <span class="brand-badge">HEAD UNIT</span>
        </div>

        <div class="clock-box" id="digital-clock">00:00</div>

        <div class="top-actions">
            <button class="btn-top" onclick="toggleTheme()" id="theme-btn">Sejuk</button>
            <button class="btn-top" onclick="openSleepModal()" id="timer-btn">Timer: Off</button>
            <button class="btn-top" onclick="toggleFullScreen()">Full</button>
            <button class="btn-top" onclick="fetchOnlineRadioData(true)">Sync</button>
        </div>
    </div>

    <!-- MAIN SPLIT -->
    <div class="main-area">
        <!-- LEFT PANEL -->
        <div class="panel left-panel">
            <div class="player-head">
                <div class="player-head-info">
                    <div class="avatar-small">
                        <img id="player-avatar-img" src="" alt="">
                    </div>
                    <div style="overflow:hidden;">
                        <span id="player-status" class="status-badge">SIAP</span>
                        <div id="player-name" class="station-title text-cut">Iswara FM</div>
                        <div id="player-sub" class="station-sub text-cut">Jawa Tengah</div>
                    </div>
                </div>
            </div>

            <div class="art-box">
                <div class="art-large">
                    <img id="main-player-art" src="" alt="">
                </div>
                <div id="player-url" class="url-text text-cut">Klik PLAY untuk memutar</div>
                <button id="fix-btn" class="btn-fix" onclick="openCurrentEdit()">Edit Stream URL</button>
            </div>

            <div class="controls-row">
                <button class="btn-ctrl" onclick="playPrevStation()" title="Sebelumnya">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="#ffffff"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="btn-play" onclick="togglePlayPause()" id="play-btn" title="Putar / Jeda">
                    <svg id="play-svg" width="34" height="34" viewBox="0 0 24 24" fill="#ffffff"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="btn-ctrl" onclick="playNextStation()" title="Berikutnya">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="#ffffff"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>

            <div class="fav-row">
                <button class="btn-fav-main" id="player-fav-btn" onclick="toggleFavCurrent()">&#9733; Stasiun Favorit</button>
            </div>

            <div class="vol-box">
                <button class="btn-vol" onclick="changeVolumeStep(-0.1)">-</button>
                <input type="range" id="vol-slider" class="vol-slider" min="0" max="1" step="0.05" value="0.9" oninput="changeVolume(this.value)" onchange="changeVolume(this.value)">
                <button class="btn-vol" onclick="changeVolumeStep(0.1)">+</button>
                <span class="vol-pct" id="vol-pct">90%</span>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="panel right-panel">
            <div class="tabs-row">
                <div class="tabs-btns">
                    <button id="tab-fav" class="tab-btn active" onclick="switchTab('favorites')">&#9733; Favorit</button>
                    <button id="tab-prov" class="tab-btn" onclick="switchTab('provinces')">Provinsi</button>
                    <button id="tab-all" class="tab-btn" onclick="switchTab('all')">Semua Radio</button>
                </div>
                <span class="count-badge" id="station-count">0 Stasiun</span>
            </div>

            <div class="toolbar">

];

var allStations = [];
var favMap = {};

var searchQuery = "";
var httpsOnly = false;
var activeList = [];
var currentIndex = 0;
var isPlaying = false;
var hlsPlayer = null;
var editingId = null;
var sleepInterval = null;
var sleepEnd = 0;

var audioEl = document.getElementById("audio-player");

function pad2(n) { return n < 10 ? "0" + n : "" + n; }

function escHtml(s) {
    if (!s) return "";
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function getFallbackSvg(name) {
    var clean = (name || "RD").replace(/^\s+|\s+$/g, "");
    var parts = clean.split(/\s+/);
    var init = parts.length >= 2 ? (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase() : clean.substring(0, 2).toUpperCase();
    var colors = ["#0284c7", "#0d9488", "#7c3aed", "#e11d48", "#ea580c", "#059669", "#4f46e5", "#d97706"];
    var hash = 0;
    for (var i = 0; i < clean.length; i++) hash = clean.charCodeAt(i) + ((hash << 5) - hash);
    var col = colors[Math.abs(hash) % colors.length];
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
        '<rect width="100" height="100" rx="20" fill="' + col + '"/>' +
        '<text x="50" y="62" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="34">' + init + '</text></svg>';
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

function getThumb(st) {
    if (st && st.favicon && st.favicon.length > 5) return st.favicon;
    return getFallbackSvg(st ? st.name : "RD");
}

function normalizeProv(st, tg, nm) {
    var t = ((st || "") + " " + (tg || "") + " " + (nm || "")).toLowerCase();
    if (/jakarta/.test(t)) return "DKI Jakarta";
    if (/jawa tengah|jateng|semarang|pekalongan|solo|surakarta|magelang|tegal|purwokerto|kudus|salatiga|cilacap/.test(t)) return "Jawa Tengah";
    if (/jawa barat|jabar|bandung|bogor|depok|bekasi|cirebon|tasikmalaya|sukabumi|garut/.test(t)) return "Jawa Barat";
    if (/yogyakarta|jogja|yogya|sleman|bantul/.test(t)) return "DI Yogyakarta";
    if (/jawa timur|jatim|surabaya|malang|kediri|madiun|jember|banyuwangi|sidoarjo/.test(t)) return "Jawa Timur";
    if (/banten|tangerang|serang|cilegon/.test(t)) return "Banten";
    if (/bali|denpasar|ubud|singaraja/.test(t)) return "Bali";
    if (/sumatera utara|sumut|medan/.test(t)) return "Sumatera Utara";
    if (/sumatera barat|sumbar|padang|bukittinggi/.test(t)) return "Sumatera Barat";
    if (/kepulauan riau|kepri|batam|tanjungpinang/.test(t)) return "Kepulauan Riau";
    if (/riau|pekanbaru/.test(t)) return "Riau";
    if (/sumatera selatan|sumsel|palembang/.test(t)) return "Sumatera Selatan";
    if (/lampung/.test(t)) return "Lampung";
    if (/aceh/.test(t)) return "Aceh";
    if (/jambi/.test(t)) return "Jambi";
    if (/bengkulu/.test(t)) return "Bengkulu";
    if (/bangka|belitung/.test(t)) return "Kepulauan Bangka Belitung";
    if (/kalimantan barat|kalbar|pontianak/.test(t)) return "Kalimantan Barat";
    if (/kalimantan selatan|kalsel|banjarmasin/.test(t)) return "Kalimantan Selatan";
    if (/kalimantan timur|kaltim|samarinda|balikpapan/.test(t)) return "Kalimantan Timur";
    if (/kalimantan tengah|kalteng|palangka/.test(t)) return "Kalimantan Tengah";
    if (/kalimantan utara|kaltara|tarakan/.test(t)) return "Kalimantan Utara";
    if (/sulawesi selatan|sulsel|makassar/.test(t)) return "Sulawesi Selatan";
    if (/sulawesi utara|sulut|manado/.test(t)) return "Sulawesi Utara";
    if (/sulawesi tengah|sulteng|palu/.test(t)) return "Sulawesi Tengah";
    if (/sulawesi tenggara|sultra|kendari/.test(t)) return "Sulawesi Tenggara";
    if (/gorontalo/.test(t)) return "Gorontalo";
    if (/sulawesi barat|sulbar|mamuju/.test(t)) return "Sulawesi Barat";
    if (/ntb|mataram|lombok/.test(t)) return "Nusa Tenggara Barat (NTB)";
    if (/ntt|kupang|flores/.test(t)) return "Nusa Tenggara Timur (NTT)";
    if (/maluku utara|ternate/.test(t)) return "Maluku Utara";
    if (/maluku|ambon/.test(t)) return "Maluku";
    if (/papua|jayapura|sorong/.test(t)) return "Papua";
    return "Nasional / Lainnya";
}

function httpGetJson(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 10000;
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status >= 200 && xhr.status < 300) {
                try { cb(null, JSON.parse(xhr.responseText)); }
                catch (e) { cb(e, null); }
            } else {
                cb(new Error("HTTP " + xhr.status), null);
            }
        }
    };
    xhr.onerror = function() { cb(new Error("Network error"), null); };
    xhr.ontimeout = function() { cb(new Error("Timeout"), null); };
    xhr.send();
}

function showToast(msg) {
    var box = document.getElementById("toast-box");
    var el = document.createElement("div");
    el.className = "toast-item";
    el.innerText = msg;
    box.appendChild(el);
    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 2600);
}

// Clock
function startClock() {
    var el = document.getElementById("digital-clock");
    function tick() {
        var d = new Date();
        el.innerText = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }
    tick();
    setInterval(tick, 1000);
}

// Theme
function toggleTheme() {
    var b = document.body;
    if (b.className.indexOf("theme-twilight") === -1) {
        b.className = "theme-twilight";
        document.getElementById("theme-btn").innerText = "Senja";
    } else {
        b.className = "";
        document.getElementById("theme-btn").innerText = "Sejuk";
    }
}

function toggleFullScreen() {
    var docEl = document.documentElement;
    var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (req) req.call(docEl);
    } else {
        if (exit) exit.call(document);
    }
}

// Storage
function loadFavs() {
    try {
        var raw = localStorage.getItem("radio_app_fav_ids");
        if (raw) {
            var arr = JSON.parse(raw);
            for (var i = 0; i < arr.length; i++) favMap[arr[i]] = true;
            return;
        }
    } catch (e) {}
    for (var j = 0; j < INITIAL_FAVS.length; j++) favMap[INITIAL_FAVS[j].id] = true;
    saveFavs();
}

function saveFavs() {
    var arr = [];
    for (var k in favMap) {
        if (favMap.hasOwnProperty(k) && favMap[k]) arr.push(k);
    }
    try { localStorage.setItem("radio_app_fav_ids", JSON.stringify(arr)); } catch (e) {}
}

function populateProvSelect() {
    var sel = document.getElementById("in-prov");
    sel.innerHTML = "";
    for (var i = 0; i < PROVINCES.length; i++) {
        var opt = document.createElement("option");
        opt.value = PROVINCES[i];
        opt.innerText = PROVINCES[i];
        sel.appendChild(opt);
    }
}

// Data Loading
function fetchOnlineRadioData(force) {
    document.getElementById("loading-box").style.display = "block";
    if (!force) {
        try {
            var cached = localStorage.getItem("radio_app_cache_v2");
            var ts = parseInt(localStorage.getItem("radio_app_cache_ts") || "0", 10);
            if (cached && (new Date().getTime() - ts < 86400000)) {
                buildStationList(JSON.parse(cached));
                document.getElementById("loading-box").style.display = "none";
                return;
            }
        } catch (e) {}
    }

    function tryMirror(idx) {
        if (idx >= API_MIRRORS.length) {
            buildStationList([]);
            document.getElementById("loading-box").style.display = "none";
            showToast("Gagal muat online, pakai data lokal");
            return;
        }
        httpGetJson(API_MIRRORS[idx], function(err, data) {
            if (!err && data && data.length > 0) {
                try {
                    localStorage.setItem("radio_app_cache_v2", JSON.stringify(data));
                    localStorage.setItem("radio_app_cache_ts", String(new Date().getTime()));
                } catch (e) {}
                buildStationList(data);
                document.getElementById("loading-box").style.display = "none";
                if (force) showToast("Database radio diperbarui!");
            } else {
                tryMirror(idx + 1);
            }
        });
    }
    tryMirror(0);
}

function buildStationList(raw) {
    var map = {};
    var list = [];

    // Custom stations
    try {
        var cRaw = localStorage.getItem("radio_app_custom_stations");
        if (cRaw) {
            var customs = JSON.parse(cRaw);
            for (var c = 0; c < customs.length; c++) {
                map[customs[c].id] = customs[c];
                list.push(customs[c]);
            }
        }
    } catch (e) {}

    // Initial Favs
    for (var f = 0; f < INITIAL_FAVS.length; f++) {
        var fv = INITIAL_FAVS[f];
        if (!map[fv.id]) {
            var copy = { id: fv.id, name: fv.name, subtitle: fv.subtitle, state: fv.state, keyword: fv.keyword, url: fv.url, favicon: fv.favicon, isHttps: false };
            map[fv.id] = copy;
            list.push(copy);
        }
    }

    // Online data
    for (var i = 0; i < raw.length; i++) {
        var it = raw[i];
        var sUrl = it.url_resolved || it.url;
        if (!sUrl) continue;
        var prov = normalizeProv(it.state, it.tags, it.name);
        var nm = it.name ? it.name.replace(/^\s+|\s+$/g, "") : "Radio Indonesia";
        var obj = {
            id: it.stationuuid || ("rb-" + i),
            name: nm,
            subtitle: (it.state || prov) + " (" + (it.codec || "MP3") + ")",
            state: prov,
            keyword: nm,
            url: sUrl,
            favicon: it.favicon || "",
            isHttps: sUrl.indexOf("https://") === 0
        };

        // Cocokkan URL ke 7 favorit awal
        for (var k = 0; k < INITIAL_FAVS.length; k++) {
            var fObj = map[INITIAL_FAVS[k].id];
            if (fObj && nm.toLowerCase().indexOf(fObj.keyword.toLowerCase()) !== -1) {
                if (!fObj.url) {
                    fObj.url = sUrl;
                    fObj.isHttps = obj.isHttps;
                }
                if (!fObj.favicon && obj.favicon) fObj.favicon = obj.favicon;
            }
        }

        if (!map[obj.id]) {
            map[obj.id] = obj;
            list.push(obj);
        }
    }

    allStations = list;
    renderTab();
    if (activeList.length > 0 && !isPlaying) {
        selectStation(0, false);
    }
}

// Rendering
function switchTab(tab) {
    currentTab = tab;
    selectedProvince = null;
    document.getElementById("tab-fav").className = "tab-btn" + (tab === "favorites" ? " active" : "");
    document.getElementById("tab-prov").className = "tab-btn" + (tab === "provinces" ? " active" : "");
    document.getElementById("tab-all").className = "tab-btn" + (tab === "all" ? " active" : "");
    renderTab();
}

function getFiltered() {
    var res = [];
    var q = searchQuery.toLowerCase();
    for (var i = 0; i < allStations.length; i++) {
        var s = allStations[i];
        if (currentTab === "favorites" && !favMap[s.id]) continue;
        if (currentTab === "provinces" && selectedProvince && s.state !== selectedProvince) continue;
        if (httpsOnly && !s.isHttps) continue;
        if (q) {
            var hay = (s.name + " " + (s.subtitle || "") + " " + (s.state || "")).toLowerCase();
            if (hay.indexOf(q) === -1) continue;
        }
        res.push(s);
    }
    return res;
}

function renderTab() {
    var cont = document.getElementById("stations-container");
    var backBar = document.getElementById("prov-back");
    cont.innerHTML = "";

    if (currentTab === "provinces" && !selectedProvince && !searchQuery) {
        backBar.style.display = "none";
        renderProvinces();
        return;
    }

    if (currentTab === "provinces" && selectedProvince) {
        backBar.style.display = "flex";
        document.getElementById("prov-title").innerText = selectedProvince;
    } else {
        backBar.style.display = "none";
    }

    activeList = getFiltered();
    document.getElementById("station-count").innerText = activeList.length + " Stasiun";

    if (activeList.length === 0) {
        cont.innerHTML = '<div style="width:100%;text-align:center;padding:30px;color:#94a3b8;">Tidak ada stasiun ditemukan.</div>';
        return;
    }

    var currId = activeList[currentIndex] ? activeList[currentIndex].id : null;

    for (var i = 0; i < activeList.length; i++) {
        (function(idx) {
            var st = activeList[idx];
            var isAct = (currId && currId === st.id);
            var isFav = !!favMap[st.id];

            var card = document.createElement("div");
            card.className = "card-item" + (isAct ? " active-card" : "");

            var html = '<div class="card-left" onclick="selectStation(' + idx + ', true)">' +
                '<div class="card-thumb"><img src="' + getThumb(st) + '" onerror="this.onerror=null;this.src=\'' + getFallbackSvg(st.name) + '\'"></div>' +
                '<div style="overflow:hidden;">' +
                '<div class="card-name text-cut">' + escHtml(st.name) + '</div>' +
                '<div class="card-meta text-cut">' + escHtml(st.state || "Indonesia") +
                (st.isHttps ? '<span class="tag-https">HTTPS</span>' : '') + '</div>' +
                '</div></div>' +
                '<div class="card-actions">' +
                '<button class="btn-mini ' + (isFav ? 'starred' : '') + '" onclick="toggleFav(event, \'' + st.id + '\')">&#9733;</button>' +
                '<button class="btn-mini" onclick="openEditModal(event, \'' + st.id + '\')">&#8942;</button>' +
                '</div>';

            card.innerHTML = html;
            cont.appendChild(card);
        })(i);
    }
    updateFavBtnPlayer();
}

function renderProvinces() {
    var cont = document.getElementById("stations-container");
    var counts = {};
    for (var i = 0; i < allStations.length; i++) {
        var s = allStations[i];
        if (httpsOnly && !s.isHttps) continue;
        var p = s.state || "Nasional / Lainnya";
        counts[p] = (counts[p] || 0) + 1;
    }
    document.getElementById("station-count").innerText = PROVINCES.length + " Provinsi";

    for (var j = 0; j < PROVINCES.length; j++) {
        (function(prov) {
            var card = document.createElement("div");
            card.className = "card-item";
            card.onclick = function() { selectedProvince = prov; renderTab(); };
            card.innerHTML = '<div class="card-left"><div style="overflow:hidden;">' +
                '<div class="card-name text-cut">' + escHtml(prov) + '</div>' +
                '<div class="card-meta">' + (counts[prov] || 0) + ' Stasiun Radio</div>' +
                '</div></div><div style="color:#38bdf8;font-weight:900;">&rsaquo;</div>';
            cont.appendChild(card);
        })(PROVINCES[j]);
    }
}

function backToProvinces() { selectedProvince = null; renderTab(); }
function handleSearch() { searchQuery = document.getElementById("search-input").value.replace(/^\s+|\s+$/g, ""); renderTab(); }
function toggleHttps() { httpsOnly = document.getElementById("https-toggle").checked; renderTab(); }

function toggleFav(e, id) {
    if (e && e.stopPropagation) e.stopPropagation();
    if (favMap[id]) { delete favMap[id]; showToast("Dihapus dari Favorit"); }
    else { favMap[id] = true; showToast("Ditambahkan ke Favorit"); }
    saveFavs();
    renderTab();
}

function toggleFavCurrent() {
    if (activeList[currentIndex]) toggleFav(null, activeList[currentIndex].id);
}

function updateFavBtnPlayer() {
    var st = activeList[currentIndex];
    if (!st) return;
    document.getElementById("player-fav-btn").innerHTML = favMap[st.id] ? "&#9733; Stasiun Favorit" : "&#9734; Tambah Favorit";
}

// Playback
function setStatus(txt, cls) {
    var el = document.getElementById("player-status");
    el.innerText = txt;
    el.className = "status-badge " + (cls || "");
}

function setPlayIcon(playing) {
    var svg = document.getElementById("play-svg");
    if (playing) {
        svg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    } else {
        svg.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
}

function selectStation(idx, autoPlay) {
    if (idx < 0 || idx >= activeList.length) return;
    currentIndex = idx;
    var st = activeList[idx];
    var th = getThumb(st);

    var av = document.getElementById("player-avatar-img");
    var art = document.getElementById("main-player-art");
    av.src = th;
    art.src = th;
    av.onerror = function() { this.onerror = null; this.src = getFallbackSvg(st.name); };
    art.onerror = function() { this.onerror = null; this.src = getFallbackSvg(st.name); };

    document.getElementById("player-name").innerText = st.name;
    document.getElementById("player-sub").innerText = (st.state || "Indonesia") + " • " + (st.subtitle || "");
    document.getElementById("fix-btn").style.display = "none";

    renderTab();
    if (autoPlay) startStream(st);
    else {
        setStatus("SIAP", "");
        document.getElementById("player-url").innerText = st.url || "Klik PLAY untuk memutar";
    }
}

function startStream(st) {
    setStatus("MENGHUBUNGKAN...", "status-buff");
    document.getElementById("fix-btn").style.display = "none";

    if (!st.url) {
        document.getElementById("player-url").innerText = "Mencari server online...";
        var searchUrl = "https://de1.api.radio-browser.info/json/stations/search?name=" + encodeURIComponent(st.keyword || st.name) + "&limit=5";
        httpGetJson(searchUrl, function(err, data) {
            if (!err && data && data.length > 0) {
                var chosen = data[0].url_resolved || data[0].url;
                for (var i = 0; i < data.length; i++) {
                    var u = data[i].url_resolved || data[i].url || "";
                    if (u.indexOf("https://") === 0) { chosen = u; break; }
                }
                st.url = chosen;
                st.isHttps = chosen.indexOf("https://") === 0;
                playAudioUrl(chosen);
            } else {
                setStatus("TIDAK DITEMUKAN", "status-err");
                document.getElementById("player-url").innerText = "Stream URL tidak ditemukan";
                document.getElementById("fix-btn").style.display = "inline-block";
            }
        });
    } else {
        playAudioUrl(st.url);
    }
}

function playAudioUrl(url) {
    document.getElementById("player-url").innerText = url;
    if (hlsPlayer) {
        try { hlsPlayer.destroy(); } catch (e) {}
        hlsPlayer = null;
    }
    if (url.indexOf(".m3u8") !== -1 && typeof Hls !== "undefined" && Hls.isSupported()) {
        hlsPlayer = new Hls();
        hlsPlayer.loadSource(url);
        hlsPlayer.attachMedia(audioEl);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() { audioEl.play(); });
    } else {
        audioEl.src = url;
        var p = audioEl.play();
        if (p && p.catch) p.catch(function() { handleErr(); });
    }
}

function togglePlayPause() {
    if (isPlaying) audioEl.pause();
    else if (activeList[currentIndex]) startStream(activeList[currentIndex]);
}

function playNextStation() {
    if (activeList.length === 0) return;
    selectStation((currentIndex + 1) % activeList.length, true);
}

function playPrevStation() {
    if (activeList.length === 0) return;
    selectStation((currentIndex - 1 + activeList.length) % activeList.length, true);
}

function handleErr() {
    isPlaying = false;
    setPlayIcon(false);
    setStatus("STREAM TERPUTUS", "status-err");
    document.getElementById("fix-btn").style.display = "inline-block";
}

audioEl.addEventListener("playing", function() {
    isPlaying = true;
    setPlayIcon(true);
    setStatus("LIVE", "status-live");
});
audioEl.addEventListener("pause", function() {
    isPlaying = false;
    setPlayIcon(false);
    setStatus("JEDA", "status-pause");
});
audioEl.addEventListener("waiting", function() {
    setStatus("BUFFERING...", "status-buff");
});
audioEl.addEventListener("error", handleErr);

// Volume
function changeVolume(v) {
    var f = Math.max(0, Math.min(1, parseFloat(v)));
    audioEl.volume = f;
    document.getElementById("vol-slider").value = f;
    document.getElementById("vol-pct").innerText = Math.round(f * 100) + "%";
}
function changeVolumeStep(d) {
    changeVolume((audioEl.volume || 0.9) + d);
}

// Sleep Timer
function openSleepModal() { document.getElementById("sleep-modal").className = "modal-bg open"; }
function closeSleepModal() { document.getElementById("sleep-modal").className = "modal-bg"; }
function setSleepTimer(m) {
    closeSleepModal();
    if (sleepInterval) clearInterval(sleepInterval);
    if (m === 0) {
        document.getElementById("timer-btn").innerText = "Timer: Off";
        showToast("Timer dimatikan");
        return;
    }
    sleepEnd = new Date().getTime() + m * 60000;
    showToast("Timer: " + m + " menit");
    sleepInterval = setInterval(function() {
        var rem = sleepEnd - new Date().getTime();
        if (rem <= 0) {
            clearInterval(sleepInterval);
            audioEl.pause();
            document.getElementById("timer-btn").innerText = "Timer: Off";
            showToast("Timer selesai");
        } else {
            var mm = Math.floor(rem / 60000);
            var ss = Math.floor((rem % 60000) / 1000);
            document.getElementById("timer-btn").innerText = mm + ":" + pad2(ss);
        }
    }, 1000);
}

// Modal Add / Edit
function openAddModal() {
    editingId = null;
    document.getElementById("modal-title").innerText = "Tambah Radio Baru";
    document.getElementById("in-name").value = "";
    document.getElementById("in-sub").value = "";
    document.getElementById("in-url").value = "";
    document.getElementById("in-prov").value = "Jawa Tengah";
    document.getElementById("btn-del-st").style.display = "none";
    document.getElementById("modal-search-res").innerHTML = "";
    document.getElementById("station-modal").className = "modal-bg open";
}

function openEditModal(e, id) {
    if (e && e.stopPropagation) e.stopPropagation();
    editingId = id;
    var st = null;
    for (var i = 0; i < allStations.length; i++) {
        if (allStations[i].id === id) { st = allStations[i]; break; }
    }
    if (!st) return;
    document.getElementById("modal-title").innerText = "Edit Stasiun";
    document.getElementById("in-name").value = st.name || "";
    document.getElementById("in-sub").value = st.subtitle || "";
    document.getElementById("in-url").value = st.url || "";
    document.getElementById("in-prov").value = st.state || "Jawa Tengah";
    document.getElementById("btn-del-st").style.display = "inline-block";
    document.getElementById("modal-search-res").innerHTML = "";
    document.getElementById("station-modal").className = "modal-bg open";
}

function openCurrentEdit() {
    if (activeList[currentIndex]) openEditModal(null, activeList[currentIndex].id);
}

function closeModal() { document.getElementById("station-modal").className = "modal-bg"; }

function saveStation() {
    var nm = document.getElementById("in-name").value.replace(/^\s+|\s+$/g, "");
    var sub = document.getElementById("in-sub").value.replace(/^\s+|\s+$/g, "");
    var url = document.getElementById("in-url").value.replace(/^\s+|\s+$/g, "");
    var prov = document.getElementById("in-prov").value;
    if (!nm) { showToast("Nama stasiun wajib diisi!"); return; }

    var customs = [];
    try { customs = JSON.parse(localStorage.getItem("radio_app_custom_stations") || "[]"); } catch (e) {}

    if (editingId) {
        for (var i = 0; i < allStations.length; i++) {
            if (allStations[i].id === editingId) {
                allStations[i].name = nm;
                allStations[i].subtitle = sub;
                allStations[i].url = url;
                allStations[i].state = prov;
                allStations[i].isHttps = url.indexOf("https://") === 0;
                break;
            }
        }
    } else {
        var nid = "custom-" + new Date().getTime();
        var obj = { id: nid, name: nm, subtitle: sub || "Custom", state: prov, keyword: nm, url: url, favicon: "", isHttps: url.indexOf("https://") === 0 };
        allStations.unshift(obj);
        favMap[nid] = true;
        customs.push(obj);
    }

    try { localStorage.setItem("radio_app_custom_stations", JSON.stringify(customs)); } catch (e) {}
    saveFavs();
    renderTab();
    closeModal();
    showToast("Stasiun disimpan!");
}

function deleteStation() {
    if (!editingId) return;
    var next = [];
    for (var i = 0; i < allStations.length; i++) {
        if (allStations[i].id !== editingId) next.push(allStations[i]);
    }
    allStations = next;
    delete favMap[editingId];
    saveFavs();
    renderTab();
    closeModal();
    showToast("Stasiun dihapus");
}

function searchOnlineInModal() {
    var kw = document.getElementById("in-name").value.replace(/^\s+|\s+$/g, "");
    if (!kw) { showToast("Isi nama stasiun dulu"); return; }
    var resBox = document.getElementById("modal-search-res");
    resBox.innerHTML = '<div style="font-size:11px;color:#94a3b8;">Mencari...</div>';
    httpGetJson("https://de1.api.radio-browser.info/json/stations/search?name=" + encodeURIComponent(kw) + "&limit=5", function(err, data) {
        if (err || !data || data.length === 0) {
            resBox.innerHTML = '<div style="font-size:11px;color:#f59e0b;">Tidak ditemukan.</div>';
            return;
        }
        resBox.innerHTML = "";
        for (var i = 0; i < data.length; i++) {
            (function(it) {
                var u = it.url_resolved || it.url;
                var d = document.createElement("div");
                d.style.cssText = "padding:6px;margin-top:4px;background:#0b1220;border:1px solid #202d48;border-radius:8px;font-size:11px;cursor:pointer;";
                d.innerText = it.name + " (" + (u.indexOf("https://") === 0 ? "HTTPS" : "HTTP") + ")";
                d.onclick = function() {
                    document.getElementById("in-url").value = u;
                    resBox.innerHTML = "";
                };
                resBox.appendChild(d);
            })(data[i]);
        }
    });
}

// Init
window.onload = function() {
    populateProvSelect();
    loadFavs();
    startClock();
    fetchOnlineRadioData(false);
    if ("mediaSession" in navigator) {
        try {
            navigator.mediaSession.setActionHandler("play", function() { audioEl.play(); });
            navigator.mediaSession.setActionHandler("pause", function() { audioEl.pause(); });
            navigator.mediaSession.setActionHandler("previoustrack", playPrevStation);
            navigator.mediaSession.setActionHandler("nexttrack", playNextStation);
        } catch (e) {}
    }
};
</script>
